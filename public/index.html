<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes y Grupos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Redes y Grupos</h1>
    <p class="lema">Amamos, vivimos la presencia de Dios, formamos discípulos y servimos al Señor.</p>
    <div id="usuario-barra" class="oculto">
      <span id="texto-usuario"></span>
      <button id="boton-cerrar-sesion" class="btn btn-borde">Cerrar sesión</button>
    </div>
  </header>

  <main>
    <section id="login-section">
      <div class="tarjeta-login">
        <h2>Inicia sesión</h2>
        <form id="formulario-login">
          <label for="cedula">Cédula</label>
          <input type="text" id="cedula" name="cedula" required>

          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required>

          <p id="mensaje-error-login" class="alerta oculto"></p>

          <button type="submit" class="btn btn-primario boton-ancho">Entrar</button>
        </form>
        <p class="nota-login">Prueba: cédula <strong>1000000001</strong> contraseña <strong>admin123</strong></p>
      </div>
    </section>

    <div id="area-app" class="oculto">
      <nav id="barra-navegacion" class="oculto">
        <button id="boton-redes" class="btn-bar">Redes</button>
        <button id="boton-buscar" class="btn-bar">Buscar</button>
      </nav>

      <button id="boton-volver" class="oculto">← Volver</button>
      <h2 id="titulo-pagina">Nuestras Redes</h2>

      <section id="formulario-section" class="oculto">
        <h3>Agregar integrante</h3>
        <form id="formulario-integrante">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required>

          <label for="celular">Celular</label>
          <input type="text" id="celular" name="celular">

          <label for="rol">Rol</label>
          <select id="rol" name="rol">
            <option>Integrante</option>
            <option>Líder</option>
            <option>Apoyo</option>
            <option>Anfitrión</option>
          </select>

          <p id="mensaje-error" class="alerta oculto"></p>

          <div class="botones">
            <button type="submit" class="btn btn-primario">Guardar</button>
            <button type="button" id="cancelar-formulario" class="btn">Cancelar</button>
          </div>
        </form>
      </section>

      <button id="boton-agregar" class="btn btn-primario oculto">+ Agregar integrante</button>

      <button id="boton-agregar-reunion" class="btn oculto">+ Registrar reunión</button>

      <section id="formulario-reunion-section" class="oculto">
        <h3>Registrar reunión</h3>
        <form id="formulario-reunion">
          <label for="fecha-reunion">Fecha</label>
          <input type="date" id="fecha-reunion" name="fecha" required>

          <label for="duracion-reunion">Duración</label>
          <input type="text" id="duracion-reunion" name="duracion" placeholder="Ej. 1 hora 45 minutos">

          <label for="observacion-reunion">Observación</label>
          <textarea id="observacion-reunion" name="observacion" rows="2"></textarea>

          <p id="mensaje-error-reunion" class="alerta oculto"></p>

          <div class="botones">
            <button type="submit" class="btn btn-primario">Guardar reunión</button>
            <button type="button" id="cancelar-reunion" class="btn">Cancelar</button>
          </div>
        </form>
      </section>

      <h3 id="titulo-reuniones" class="oculto">Reuniones</h3>
      <section id="lista-reuniones"></section>

      <section id="lista-redes"></section>
      <section id="detalle" class="oculto"></section>

      <section id="seccion-busqueda" class="oculto">
        <form id="formulario-busqueda">
          <input type="search" id="campo-busqueda" name="q" placeholder="Nombre, cédula o celular" required>
          <button type="submit" class="btn btn-primario boton-ancho">Buscar</button>
        </form>
        <p id="mensaje-busqueda" class="vacio oculto"></p>
        <section id="resultados"></section>
      </section>
    </div>
  </main>

  <footer>
    <p>Administración de grupos pequeños</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
